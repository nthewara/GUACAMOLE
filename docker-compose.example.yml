# Reference Guacamole stack with custom FreeRDP 3.x guacd.
#
# SANITIZED EXAMPLE — do NOT commit real secrets. Supply passwords via a
# .env file (see below) or Docker secrets. Build the guacd image first:
#   docker build -t guacd:1.6.0-freerdp3.28 ./guacd-freerdp3
#
# Then: docker compose up -d
#
# .env file example (do NOT commit it):
#   MYSQL_ROOT_PASSWORD=change-me-root
#   MYSQL_PASSWORD=change-me-guac

services:
  guacd:
    # Custom image built from ./guacd-freerdp3/Dockerfile (FreeRDP 3.x + GFX)
    image: guacd:1.6.0-freerdp3.28
    container_name: guacd
    restart: always
    networks:
      - guac-net

  mysql:
    image: mysql/mysql-server:latest
    container_name: guac-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: guacamole_db
      MYSQL_USER: guacamole_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - guac-db:/var/lib/mysql
      # First-run only: mount an initdb SQL dir generated by Guacamole's
      # initdb.sh to create the schema. See the official Guacamole manual.
      # - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - guac-net

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    restart: always
    depends_on:
      - guacd
      - mysql
    ports:
      - "8080:8080"
    environment:
      GUACD_HOSTNAME: guacd
      MYSQL_HOSTNAME: mysql
      MYSQL_DATABASE: guacamole_db
      # NOTE: Guacamole 1.6.0 renamed MYSQL_USER -> MYSQL_USERNAME
      MYSQL_USERNAME: guacamole_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - guac-net

networks:
  guac-net:
    driver: bridge

volumes:
  guac-db:
